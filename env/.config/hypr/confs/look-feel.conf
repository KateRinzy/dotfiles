general {
    gaps_in = 5
    gaps_out = 5

    border_size = 2

    col.active_border = rgba(C4A7E7FF)
    col.inactive_border = rgba(1F1F28FF)

    layout = dwindle

    snap {
        enabled = true
        window_gap = 10
        monitor_gap = 10
        respect_gaps = true
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    force_split = 2
}

decoration {
    rounding = 0

    dim_special = 0.3

    shadow {
        enabled = false
    }

    blur {
        enabled = true
    }
}

animations {
    enabled = no
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true

    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    enable_anr_dialog = true
}
