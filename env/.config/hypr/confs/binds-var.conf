# WM

bind = $mainMod,                   K, exec,                             hyprctl kill
bind = $mainMod,                   C, killactive,
bind = $mainMod,                  F8, exit,
bind = $mainMod,              escape, exec,                             wlogout
bind = $mainMod,                   L, exec,                             hyprlock
bind = $mainMod,                   V, togglefloating,
bind = $mainMod,                   J, togglesplit,
bind = $mainMod,                   F, fullscreen
bind = $mainMod SHIFT,             P, movecurrentworkspacetomonitor,    +1
bind = ALT,                      Tab, cyclenext,                        prev
bind = ALT,                      Tab, bringactivetotop
bind = $mainMod,                   P, pseudo
bind = $mainMod,                 TAB, workspace,                        previous
bind = $mainMod,                   B, exec,                             ~/.config/waybar/waybar.sh
bind = $mainMod,                 F12, exec,                             dunstctl history-pop
bind = ALT, SPACE, exec, hyprctl switchxkblayout keyboard next

# Apps
bind = $mainMod,               minus, exec,                             ~/.config/hypr/scripts/nvim-anywhere.sh
bind = $mainMod CONTROL,           V, exec,                             cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy
bind = $mainMod,                   Q, exec,                             kitty
bind = $mainMod,              RETURN, exec,                             ghostty
bind = $mainMod,                   W, exec,                             firefox
bind = $mainMod,           page_down, exec,                             kitty --class=calc tmux new-session qalc
bind = $mainMod,                   R, exec,                             rofi -show drun
bind = $mainMod,                home, exec,                             rofi -show calc -modi calc -no-show-match -no-sort
bind = $mainMod,              delete, exec,                             rofi -prompt "> " -show run
bind = $mainMod,                   Y, exec,                             ~/.config/hypr/scripts/WallpaperSelect.sh
bind = $mainMod,                   T, exec,                             dunstify "$(date)"
bind = $mainMod   SHIFT,           F, exec,                             thunar
bind = $mainMod   SHIFT,           Z, exec,                             zen-browser
bind = $mainMod,                   S, exec,                             ~/.config/hypr/scripts/hyprshot.sh "simple"
bind = ,                    code:107, exec,                             ~/.config/hypr/scripts/hyprshot.sh "screen" # 107 is the print screen button
bind = $mainMod SHIFT,             S, exec,                             ~/.config/hypr/scripts/hyprshot.sh
bind = $mainMod SHIFT,             T, exec,                             ~/.config/hypr/scripts/get-text.sh
bind = $mainMod SHIFT,             C, exec,                             hyprpicker -a
bind = $mainMod,              period, exec,                             rofi -modi emoji -show emoji
bind = $mainMod,          apostrophe, exec,                             ~/.config/hypr/scripts/vim-scratch.sh zxcv
bind = $mainMod,                 F10, exec,                             ~/.config/hypr/scripts/vim-scratch.sh faire

# bind = $mainMod,               space, togglespecialworkspace,           gedit

bind = $mainMod,               grave, togglespecialworkspace,           specialwork
bind = $mainMod SHIFT,         grave, movetoworkspace,                  special:specialwork

bind = $mainMod,                   1, workspace,                        $ws01
bind = $mainMod,                   2, workspace,                        $ws02
bind = $mainMod,                   3, workspace,                        $ws03
bind = $mainMod,                   4, workspace,                        $ws04
bind = $mainMod,                   5, workspace,                        $ws05
bind = $mainMod,                   6, exec,                             ~/.config/hypr/scripts/spawn-if-empty.sh 6 thunderbird
bind = $mainMod,                   7, workspace,                        $ws07
bind = $mainMod,                   8, workspace,                        $ws08
bind = $mainMod,                   9, workspace,                        $ws09
bind = $mainMod,                   0, workspace,                        $ws10

bind = $mainMod,                   F1, exec,                             ~/.config/hypr/scripts/spawn-if-empty.sh 6 thunderbird
bind = $mainMod,                   F2, workspace,                       $ws07
bind = $mainMod,                   F3, workspace,                       $ws08
bind = $mainMod,                   F4, workspace,                       $ws09

bind = $mainMod SHIFT,             1, movetoworkspace,                  $ws01
bind = $mainMod SHIFT,             2, movetoworkspace,                  $ws02
bind = $mainMod SHIFT,             3, movetoworkspace,                  $ws03
bind = $mainMod SHIFT,             4, movetoworkspace,                  $ws04
bind = $mainMod SHIFT,             5, movetoworkspace,                  $ws05
bind = $mainMod SHIFT,             6, movetoworkspace,                  $ws06
bind = $mainMod SHIFT,             7, movetoworkspace,                  $ws07
bind = $mainMod SHIFT,             8, movetoworkspace,                  $ws08
bind = $mainMod SHIFT,             9, movetoworkspace,                  $ws09
bind = $mainMod SHIFT,             0, movetoworkspace,                  $ws10

bind = $mainMod SHIFT,            F1, movetoworkspace,                  $ws06
bind = $mainMod SHIFT,            F2, movetoworkspace,                  $ws07
bind = $mainMod SHIFT,            F3, movetoworkspace,                  $ws08
bind = $mainMod SHIFT,            F4, movetoworkspace,                  $ws09

bind = $mainMod,          mouse_down, workspace,                        e-1
bind = $mainMod,            mouse_up, workspace,                        e+1

bind = $mainMod,                left, workspace,                        e-1
bind = $mainMod,               right, workspace,                        e+1

bind = $mainMod CONTROL,        left, workspace,                        -1
bind = $mainMod CONTROL,       right, workspace,                        +1
bind = $mainMod SHIFT,          left, movetoworkspace,                  -1
bind = $mainMod SHIFT,         right, movetoworkspace,                  +1

# Window
bind = $mainMod,                   h, movefocus,                        l
bind = $mainMod,                   i, movefocus,                        r
bind = $mainMod,                   e, movefocus,                        u
bind = $mainMod,                   n, movefocus,                        d

bind = $mainMod SHIFT,             h, movewindow,                       l
bind = $mainMod SHIFT,             n, movewindow,                       d
bind = $mainMod SHIFT,             e, movewindow,                       u
bind = $mainMod SHIFT,             i, movewindow,                       r

binde = $mainMod SHIFT,            k, resizeactive,                     -20 0
binde = $mainMod SHIFT,            m, resizeactive,                     20 0

bindm = $mainMod,          CONTROL_L, movewindow
bindm = $mainMod SHIFT,    CONTROL_L, resizewindow
bindm = $mainMod,          mouse:272, movewindow
bindm = $mainMod,          mouse:273, resizewindow

# Groups
bind = $mainMod,                   G, togglegroup
bind = ALT,                        G, moveoutofgroup
bind = CONTROL ALT,              TAB, changegroupactive,                f
bind = SHIFT ALT,                TAB, changegroupactive,                b

# Zoom
binde = $mainMod ALT CONTROL,  equal, exec,                             hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
binde = $mainMod ALT CONTROL,  minus, exec,                             hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')
bind =  $mainMod ALT CONTROL,      0, exec,                             hyprctl -q keyword cursor:zoom_factor 1

# Sound and brightness
bindel = ,      XF86AudioRaiseVolume, exec,                             wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ && ~/.config/hypr/scripts/volume-dunst.sh
bindel = ,      XF86AudioLowerVolume, exec,                             wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%- && ~/.config/hypr/scripts/volume-dunst.sh
bindel = $mainMod,                 M, exec,                             wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && ~/.config/hypr/scripts/volume-dunst.sh

bindel = ,       XF86MonBrightnessUp, exec,                             brightnessctl -e s 2%+
bindel = ,     XF86MonBrightnessDown, exec,                             brightnessctl -e s 2%-

# Media control
bindl = ,              XF86AudioNext, exec,                             playerctl next
bindl = ,             XF86AudioPause, exec,                             playerctl play-pause
bindl = ,              XF86AudioPlay, exec,                             playerctl play-pause
bindl = ,              XF86AudioPrev, exec,                             playerctl previous
bindl = ,              XF86AudioMute, exec,                             playerctl play-pause
bind = $mainMod,             page_up, exec,                             ~/.config/hypr/scripts/change-sound-output.sh
