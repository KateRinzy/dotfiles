input {
    kb_layout = usc,cac
    kb_options = caps:escape, grp:alt_space_toggle

    follow_mouse = 1

    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace
gesture = 3, swipe, mod: $mainMod, resize

device {
    name=wacom-one-by-wacom-m-pen
    output=HDMI-A-1
}

device {
    name=elan06fa:00-04f3:327e-touchpad
    enabled = true
}

cursor {
    inactive_timeout = 15
}

