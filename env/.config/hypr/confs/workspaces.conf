workspace = 1, defaultName:一, monitor:HDMI-A-1,   default:true
workspace = 2, defaultName:二, monitor:HDMI-A-1
workspace = 3, defaultName:三, monitor:HDMI-A-1
workspace = 4, defaultName:四, monitor:HDMI-A-1
workspace = 5, defaultName:五, monitor:HDMI-A-1
workspace = 6, defaultName:六, monitor:HDMI-A-1
workspace = 7, defaultName:七, monitor:HDMI-A-1
workspace = 8, defaultName:八, monitor:HDMI-A-1
workspace = 9, defaultName:九, monitor:HDMI-A-1
workspace = 10, defaultName:十, monitor:eDP-1,      default:true

workspace = 1, gapsout:0, gapsin:0
workspace = s[1], gapsout:100, gapsin:0, bordersize:2

windowrule = match:class firefox,                       workspace 1
windowrule = match:class com.mitchellh.ghostty,         workspace 2
windowrule = match:title Minecraft.*,                   workspace 4
windowrule = match:class cs2,                           workspace 4
windowrule = match:class worldofwarships64.exe,         workspace 4
windowrule = match:class forzahorizon5.exe,             workspace 4
windowrule = match:class overwatch.exe,                 workspace 4
windowrule = match:class discovery.exe,                 workspace 4

windowrule = match:class steam,                         workspace 5
windowrule = match:class org.mozilla.Thunderbird,       workspace 6
windowrule = match:class spotify, workspace 8
windowrule = match:class [discord|vesktop],             workspace 9
windowrule = match:title Picture-in-Picture,            workspace 10 silent
windowrule = match:class com.mitchellh.ghostty.scratch, workspace special:specialwork

windowrule = match:float true, rounding 10
