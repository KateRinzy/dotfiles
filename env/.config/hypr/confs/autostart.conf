exec-once = [workspace special:gedit silent] gedit
exec-once = [workspace special:ghosttyyyyy silent] ghostty

exec-once = ckb-next
exec-once = keepassxc

exec-once = ~/.config/hypr/scripts/setxkbmap.sh
exec-once = ~/.config/waybar/waybar.sh "work"; pkill waybar

exec-once = dunst
exec-once = udiskie --tray
exec-once = fcitx5
exec-once = swww-daemon
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store --no-persist

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=hyprland
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME
exec-once = systemctl --user start hyprpolkitagent
