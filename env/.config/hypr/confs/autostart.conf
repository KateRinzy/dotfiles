exec-once = [workspace special:gedit silent] gedit

exec-once = [workspace special:preloads silent] ghostty
exec-once = [workspace special:preloads silent] thunar

exec-once = thunderbird

exec-once = ~/.config/hypr/scripts/setxkbmap.sh
exec-once = ~/.config/waybar/waybar.sh

exec-once = blueman-applet
exec-once = ckb-next
exec-once = dunst
exec-once = fcitx5
exec-once = keepassxc
exec-once = nm-applet
exec-once = swww-daemon
exec-once = udiskie --tray
exec-once = wl-paste --watch cliphist store --no-persist

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=hyprland
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME
exec-once = systemctl --user start hyprpolkitagent
