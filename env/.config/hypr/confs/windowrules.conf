windowrule = match:class calc,                          float on
windowrule = match:class calc,                          pin on
windowrule = match:class calc,                          size 70% 50%

windowrule = match:class steam_app_1551360,             float on

windowrule = match:title Minecraft.*,                   render_unfocused on

windowrule = match:class unityhub,                      float on

windowrule = match:class org.pulseaudio.pavucontrol,    float on
windowrule = match:class org.pulseaudio.pavucontrol,    center on
windowrule = match:class org.pulseaudio.pavucontrol,    size 1000 700

windowrule = match:class nvim-anywhere,                 float on
windowrule = match:class nvim-anywhere,                 size 900 300
windowrule = match:class nvim-anywhere,                 center on

windowrule = match:title Save.*,                        float on
windowrule = match:title Save.*,                        size 1000 700
windowrule = match:title Save.*,                        center on

windowrule = match:class .*,                            suppress_event maximize




